[workspace]
exclude = ["vendor/skate3-engine", "vendor/skate3-engine/crates/skate-core", "vendor/skate3-engine/crates/skate-audio", "vendor/skate3-engine/crates/skate-audio-fma", "vendor/skate3-engine/crates/skate-data", "vendor/skate3-engine/crates/skate-game", "vendor/skate3-engine/crates/skate-dynamics", "vendor/skate3-engine/crates/skate-mods", "vendor/skate3-engine/crates/skate-net", "vendor/skate3-engine/crates/skate-steam-relay"]
resolver = "2"
members = [
    "apps/skate2-pc",
    "apps/skate2-server",
    "crates/skate2-audio",
    "crates/skate2-core",
    "crates/skate2-formats",
    "crates/skate2-net",
    "crates/skate2-symbols",
    "crates/skate2-update",
    "crates/skate2-xma",
]

[workspace.package]
# The release version: with a release key it names the build's secret (apps/build_secret.rs), so a
# new version's game and server meet only each other.
version = "0.2.9"
edition = "2024"
license = "MIT"
rust-version = "1.85"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"

# Reuse compiler work between playtest builds. Keep the existing release
# optimization level and codegen partition count rather than trading FPS for
# build speed. The first build populates target/release/incremental.
[profile.release]
incremental = true
codegen-units = 16
debug = "line-tables-only"
